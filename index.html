<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003566">
<meta name="description" content="Sistema profesional de registro de ventas Telcel">

<title>Sistema Ventas Telcel Pro</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',system-ui,sans-serif;
    background:
        radial-gradient(circle at top,#00509d 0,#003566 35%,#000814 100%);
    min-height:100vh;
    color:white;
}

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:20px;
    position:relative;
}

.hidden{
    display:none!important;
}

.card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.30);
    border:1px solid rgba(255,255,255,.12);
}

.header{
    text-align:center;
    font-size:21px;
    font-weight:800;
    color:#ffc300;
    margin:10px 0 20px;
}

.subheader{
    text-align:center;
    opacity:.7;
    font-size:12px;
    margin-top:-15px;
    margin-bottom:20px;
}

label{
    display:block;
    font-size:11px;
    font-weight:700;
    color:#ffc300;
    margin-top:4px;
}

input,
select{
    width:100%;
    padding:13px;
    margin-top:5px;
    margin-bottom:13px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.11);
    color:white;
    outline:none;
    font-size:14px;
}

input:focus,
select:focus{
    border-color:#ffc300;
    box-shadow:0 0 0 2px rgba(255,195,0,.15);
}

select option{
    color:#111;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
    margin-bottom:10px;
}

button:active{
    transform:scale(.98);
}

.btn-main{
    background:#ffc300;
    color:#003566;
}

.btn-main:hover{
    background:#ffd23f;
}

.btn-excel{
    background:#1f7a3f;
    color:white;
}

.btn-sync{
    background:#0077b6;
    color:white;
}

.btn-danger{
    background:#d62828;
    color:white;
}

.btn-logout{
    position:absolute;
    top:20px;
    right:20px;
    background:#ff4d4d;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    font-size:12px;
    width:auto;
}

.login{
    max-width:370px;
    margin:90px auto;
    background:white;
    color:#111;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.login h2{
    color:#003566;
}

.login input{
    color:#111;
    background:#f1f1f1;
}

.login input::placeholder{
    color:#777;
}

.status-bar{
    display:flex;
    gap:8px;
    margin-bottom:16px;
}

.stat{
    flex:1;
    background:rgba(255,255,255,.08);
    border-radius:14px;
    padding:12px 6px;
    text-align:center;
}

.stat-number{
    font-size:20px;
    font-weight:800;
    color:#ffc300;
}

.stat-label{
    font-size:9px;
    opacity:.7;
    text-transform:uppercase;
}

.connection{
    text-align:center;
    font-size:11px;
    padding:7px;
    border-radius:8px;
    margin-bottom:15px;
}

.online{
    background:rgba(0,180,80,.18);
    color:#6dffad;
}

.offline{
    background:rgba(255,70,70,.18);
    color:#ff9292;
}

.usuario{
    text-align:center;
    font-size:11px;
    opacity:.6;
    margin-bottom:15px;
}

.venta-item{
    background:rgba(255,255,255,.07);
    padding:15px;
    border-radius:14px;
    margin-bottom:12px;
    border-left:5px solid #ffc300;
    font-size:11px;
    position:relative;
}

.venta-tel{
    color:#ffc300;
    font-weight:800;
    font-size:15px;
    padding-right:60px;
}

.venta-tipo{
    opacity:.75;
    margin:4px 0 8px;
}

.status-icon{
    position:absolute;
    top:15px;
    right:45px;
    font-size:15px;
}

.btn-del{
    position:absolute;
    top:10px;
    right:10px;
    color:#ff5c5c;
    cursor:pointer;
    font-size:17px;
    padding:5px;
}

.grid-datos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    border-top:1px solid rgba(255,255,255,.1);
    padding-top:10px;
}

.dato{
    word-break:break-word;
}

.dato b{
    color:#ffc300;
    display:block;
    font-size:9px;
    text-transform:uppercase;
    margin-bottom:2px;
}

.search{
    margin-bottom:12px;
}

.empty{
    text-align:center;
    opacity:.5;
    padding:25px 5px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#111;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    font-size:12px;
    z-index:9999;
    box-shadow:0 8px 25px rgba(0,0,0,.4);
    animation:entrada .2s ease;
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translate(-50%,10px);
    }
    to{
        opacity:1;
        transform:translate(-50%,0);
    }
}

.section-title{
    color:#ffc300;
    font-size:13px;
    font-weight:800;
    margin-bottom:12px;
}

.small{
    font-size:10px;
    opacity:.6;
}

hr{
    border:0;
    border-top:1px solid rgba(255,255,255,.1);
    margin:15px 0;
}
</style>
</head>

<body>

<div id="loginBox" class="login">

    <h2 id="tituloAuth">Acceso Sistema</h2>

    <p style="font-size:12px;color:#666;">
        Sistema de ventas Telcel
    </p>

    <input id="u"
           type="email"
           placeholder="Correo electrónico"
           autocomplete="email">

    <input id="p"
           type="password"
           placeholder="Contraseña"
           autocomplete="current-password">

    <button class="btn-main" onclick="entrar()">
        <i class="fa-solid fa-right-to-bracket"></i>
        ENTRAR
    </button>

    <button
        style="background:none;color:#003566;font-size:12px;"
        onclick="toggleRegistro()"
        id="btnT">
        ¿No tienes cuenta? Regístrate
    </button>

</div>


<div id="appBox" class="app hidden">

    <button class="btn-logout" onclick="salir()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Salir
    </button>

    <div class="header">
        REGISTRO DE VENTAS
    </div>

    <div id="conexion" class="connection online">
        <i class="fa-solid fa-wifi"></i>
        Conectado
    </div>

    <div id="usuarioActual" class="usuario"></div>


    <!-- ESTADISTICAS -->

    <div class="status-bar">

        <div class="stat">
            <div id="totalVentas" class="stat-number">0</div>
            <div class="stat-label">Total</div>
        </div>

        <div class="stat">
            <div id="ventasSync" class="stat-number">0</div>
            <div class="stat-label">Nube</div>
        </div>

        <div class="stat">
            <div id="ventasPend" class="stat-number">0</div>
            <div class="stat-label">Pendientes</div>
        </div>

    </div>


    <!-- FORMULARIO -->

    <form id="fReg">

        <div class="card">

            <div class="section-title">
                <i class="fa-solid fa-sim-card"></i>
                DATOS DE ACTIVACIÓN
            </div>

            <label>TIPO DE PRODUCTO</label>

            <select id="iTipo" required onchange="ajustarCampos()">

                <option value="">
                    Seleccionar
                </option>

                <option value="KIT">
                    KIT
                </option>

                <option value="CHIP">
                    CHIP
                </option>

                <option value="PORTA">
                    PORTA
                </option>

                <option value="RENUEVATE">
                    RENUEVATE
                </option>

            </select>


            <label>
                FECHA DE ACTIVACIÓN
            </label>

            <input
                id="iFec"
                required
                maxlength="10"
                placeholder="DD/MM/YYYY">


            <label>
                NUM. CELULAR
            </label>

            <input
                id="iTel"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                required
                placeholder="10 dígitos">


            <label>
                ICCID
            </label>

            <input
                id="iIcc"
                inputmode="numeric"
                required
                placeholder="ICCID">

        </div>


        <!-- EQUIPO -->

        <div id="seccionEquipo" class="card">

            <div class="section-title">
                <i class="fa-solid fa-mobile-screen"></i>
                DATOS DEL EQUIPO
            </div>

            <label>IMEI</label>

            <input
                id="iIme"
                inputmode="numeric"
                maxlength="15"
                placeholder="15 dígitos">

            <label>MARCA</label>

            <input
                id="iMarca"
                placeholder="Ej. Motorola">

            <label>MODELO</label>

            <input
                id="iMod"
                placeholder="Ej. Edge 20 Lite">

        </div>


        <!-- TIENDA -->

        <div class="card">

            <div class="section-title">
                <i class="fa-solid fa-store"></i>
                DATOS DE TIENDA
            </div>

            <label>
                # TIENDA / DETERMINANTE
            </label>

            <input
                id="iTiendaNum"
                required
                placeholder="Ej. 1234">


            <label>
                SOLO NOMBRE DE LA CADENA
            </label>

            <input
                id="iCadena"
                required
                placeholder="Ej. Bodega Aurrerá">


            <label>
                SOLO NOMBRE DE TIENDA
            </label>

            <input
                id="iTiendaNombre"
                required
                placeholder="Ej. Otumba">


            <label>
                NOMBRE COMPLETO PROMOTOR
            </label>

            <input
                id="iProm"
                required
                placeholder="Nombre completo">

        </div>


        <button type="submit" class="btn-main">

            <i class="fa-solid fa-floppy-disk"></i>

            GUARDAR VENTA

        </button>

    </form>


    <!-- SINCRONIZACION -->

    <div class="card">

        <div class="section-title">
            <i class="fa-solid fa-cloud"></i>
            SINCRONIZACIÓN
        </div>

        <button
            class="btn-sync"
            onclick="sincronizarPendientes()">

            <i class="fa-solid fa-arrows-rotate"></i>

            SINCRONIZAR PENDIENTES

        </button>

        <div class="small" style="text-align:center;">
            Las ventas pendientes se enviarán automáticamente
            cuando vuelva la conexión.
        </div>

    </div>


    <!-- EXCEL -->

    <button class="btn-excel" onclick="exportarExcel()">

        <i class="fa-solid fa-file-excel"></i>

        DESCARGAR EXCEL (.XLSX)

    </button>


    <div class="header" style="font-size:16px;margin-top:25px;">

        HISTORIAL DE VENTAS

    </div>


    <input
        id="buscador"
        class="search"
        placeholder="🔎 Buscar celular, ICCID, tienda..."
        oninput="cargarVentasLocales()">


    <div id="listaLocal"></div>

</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD4UK_j8UxMwOCtrtXlYftBe_wCLE7psMc",

    authDomain:
        "ventastelcel4029.firebaseapp.com",

    databaseURL:
        "https://ventastelcel4029-default-rtdb.firebaseio.com",

    projectId:
        "ventastelcel4029",

    storageBucket:
        "ventastelcel4029.firebasestorage.app",

    messagingSenderId:
        "480758010888",

    appId:
        "1:480758010888:web:e948c54f0217536aa9adbd"

};


let db;
let auth;
let modoReg = false;


/* =========================================================
   INICIO
========================================================= */

function inicio(){

    if(!firebase.apps.length){

        firebase.initializeApp(firebaseConfig);

    }

    db = firebase.database();
    auth = firebase.auth();


    colocarFecha();


    auth.onAuthStateChanged(user => {

        if(user){

            mostrarApp();

        }else{

            loginBox.classList.remove("hidden");
            appBox.classList.add("hidden");

        }

    });


    actualizarConexion();

    window.addEventListener(
        "online",
        () => {

            actualizarConexion();

            sincronizarPendientes();

        }
    );


    window.addEventListener(
        "offline",
        actualizarConexion
    );

}


/* =========================================================
   FECHA
========================================================= */

function fechaActual(){

    const d = new Date();

    return String(d.getDate()).padStart(2,"0")
        + "/"
        + String(d.getMonth()+1).padStart(2,"0")
        + "/"
        + d.getFullYear();

}


function colocarFecha(){

    iFec.value = fechaActual();

}


/* =========================================================
   LOGIN
========================================================= */

function toggleRegistro(){

    modoReg = !modoReg;

    tituloAuth.innerText =
        modoReg
        ? "Crear Usuario"
        : "Acceso Sistema";

    btnT.innerText =
        modoReg
        ? "Ya tengo cuenta, entrar"
        : "¿No tienes cuenta? Regístrate";

}


function entrar(){

    const email =
        u.value.trim();

    const password =
        p.value.trim();


    if(!email || !password){

        alert("Por favor llena todos los campos.");

        return;

    }


    if(password.length < 6){

        alert(
            "La contraseña debe tener mínimo 6 caracteres."
        );

        return;

    }


    if(modoReg){

        auth
        .createUserWithEmailAndPassword(
            email,
            password
        )
        .then(() => {

            mostrarToast(
                "Usuario creado correctamente."
            );

            modoReg = false;

            toggleRegistro();

        })
        .catch(error => {

            alert(
                "No se pudo crear el usuario:\n\n"
                + error.message
            );

        });

    }else{

        auth
        .signInWithEmailAndPassword(
            email,
            password
        )
        .catch(error => {

            alert(
                "Acceso denegado:\n\n"
                + error.message
            );

        });

    }

}


function salir(){

    auth.signOut();

}


/* =========================================================
   APP
========================================================= */

function mostrarApp(){

    loginBox.classList.add("hidden");

    appBox.classList.remove("hidden");


    usuarioActual.innerHTML =
        '<i class="fa-solid fa-user"></i> '
        + escapar(auth.currentUser.email);


    cargarVentasLocales();

    sincronizarPendientes();

}


/* =========================================================
   CONEXION
========================================================= */

function actualizarConexion(){

    const el =
        document.getElementById("conexion");


    if(navigator.onLine){

        el.className =
            "connection online";

        el.innerHTML =
            '<i class="fa-solid fa-wifi"></i> Conectado';

    }else{

        el.className =
            "connection offline";

        el.innerHTML =
            '<i class="fa-solid fa-wifi"></i> Sin conexión';

    }

}


/* =========================================================
   CAMPOS DINAMICOS
========================================================= */

function ajustarCampos(){

    const tipo =
        iTipo.value;


    if(
        tipo === "CHIP" ||
        tipo === "PORTA"
    ){

        seccionEquipo
            .classList
            .add("hidden");

        iIme.value = "";
        iMarca.value = "";
        iMod.value = "";

    }else{

        seccionEquipo
            .classList
            .remove("hidden");

    }

}


/* =========================================================
   LIMPIEZA / VALIDACION
========================================================= */

function soloNumeros(valor){

    return String(valor)
        .replace(/\D/g,"");

}


function validarVenta(){

    const telefono =
        soloNumeros(iTel.value);

    const iccid =
        soloNumeros(iIcc.value);

    const tipo =
        iTipo.value;


    if(telefono.length !== 10){

        alert(
            "El número celular debe tener exactamente 10 dígitos."
        );

        iTel.focus();

        return false;

    }


    if(iccid.length < 10){

        alert(
            "El ICCID parece incompleto."
        );

        iIcc.focus();

        return false;

    }


    if(
        tipo === "KIT" ||
        tipo === "RENUEVATE"
    ){

        const imei =
            soloNumeros(iIme.value);


        if(imei.length !== 15){

            alert(
                "El IMEI debe tener exactamente 15 dígitos."
            );

            iIme.focus();

            return false;

        }

    }


    return true;

}


/* =========================================================
   GUARDAR VENTA
========================================================= */

fReg.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        if(!validarVenta()){

            return;

        }


        const user =
            auth.currentUser;


        if(!user){

            alert("Tu sesión expiró.");

            return;

        }


        const venta = {

            id: crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now()
                  + "_"
                  + Math.random()
                      .toString(36)
                      .substring(2),

            usuarioUID:
                user.uid,

            usuarioEmail:
                user.email,

            sincronizado:
                false,

            "NUM. CELULAR":
                soloNumeros(iTel.value),

            "IMEI":
                soloNumeros(iIme.value) || "-",

            "ICCID":
                soloNumeros(iIcc.value),

            "Renuevate / Kit / Chip / Porta":
                iTipo.value,

            "# TIENDA / Determinante":
                iTiendaNum.value.trim(),

            "SOLO NOMBRE DE LA CADENA":
                iCadena.value.trim(),

            "SOLO NOMBRE DE TIENDA SIN CADENA":
                iTiendaNombre.value.trim(),

            "NOMBRE COMPLETO PROMOTOR":
                iProm.value.trim(),

            "FECHA DE ACTIVACION":
                iFec.value.trim(),

            "MARCA":
                iMarca.value.trim() || "-",

            "MODELO":
                iMod.value.trim() || "-",

            fechaCreacion:
                Date.now()

        };


        guardarLocal(venta);


        fReg.reset();

        ajustarCampos();

        colocarFecha();

        cargarVentasLocales();


        mostrarToast(
            "Venta guardada correctamente."
        );


        if(navigator.onLine){

            await sincronizarVenta(venta);

        }

    }
);


/* =========================================================
   LOCAL STORAGE
========================================================= */

function obtenerVentas(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "ventas_save"
            ) || "[]"
        );

    }catch(e){

        return [];

    }

}


function guardarLocal(venta){

    const ventas =
        obtenerVentas();


    ventas.unshift(venta);


    localStorage.setItem(
        "ventas_save",
        JSON.stringify(ventas)
    );

}


/* =========================================================
   SINCRONIZAR UNA VENTA
========================================================= */

async function sincronizarVenta(venta){

    const user =
        auth.currentUser;


    if(!user || !navigator.onLine){

        return false;

    }


    try{

        await db
            .ref(
                "ventas/"
                + user.uid
                + "/"
                + venta.id
            )
            .set(venta);


        marcarSincronizado(
            venta.id
        );


        return true;

    }catch(error){

        console.error(
            "Error Firebase:",
            error
        );

        return false;

    }

}


/* =========================================================
   SINCRONIZAR PENDIENTES
========================================================= */

async function sincronizarPendientes(){

    const user =
        auth.currentUser;


    if(
        !user ||
        !navigator.onLine
    ){

        return;

    }


    const ventas =
        obtenerVentas();


    const pendientes =
        ventas.filter(
            venta =>
                !venta.sincronizado
        );


    if(pendientes.length === 0){

        cargarVentasLocales();

        return;

    }


    mostrarToast(
        "Sincronizando "
        + pendientes.length
        + " venta(s)..."
    );


    for(const venta of pendientes){

        await sincronizarVenta(
            venta
        );

    }


    cargarVentasLocales();


    mostrarToast(
        "Sincronización terminada."
    );

}


/* =========================================================
   MARCAR SINCRONIZADO
========================================================= */

function marcarSincronizado(id){

    const ventas =
        obtenerVentas();


    const venta =
        ventas.find(
            x => x.id === id
        );


    if(venta){

        venta.sincronizado =
            true;


        localStorage.setItem(
            "ventas_save",
            JSON.stringify(ventas)
        );

    }

}


/* =========================================================
   ELIMINAR
========================================================= */

async function eliminarVenta(id){

    if(
        !confirm(
            "¿Seguro que quieres eliminar esta venta?"
        )
    ){

        return;

    }


    const user =
        auth.currentUser;


    const ventas =
        obtenerVentas();


    const venta =
        ventas.find(
            x => x.id === id
        );


    const nuevas =
        ventas.filter(
            x => x.id !== id
        );


    localStorage.setItem(
        "ventas_save",
        JSON.stringify(nuevas)
    );


    /*
       Si estaba sincronizada,
       también se elimina de Firebase.
    */

    if(
        venta &&
        venta.sincronizado &&
        user &&
        navigator.onLine
    ){

        try{

            await db
                .ref(
                    "ventas/"
                    + user.uid
                    + "/"
                    + id
                )
                .remove();

        }catch(error){

            console.error(
                error
            );

            alert(
                "Se eliminó localmente, "
                + "pero no se pudo eliminar de la nube."
            );

        }

    }


    cargarVentasLocales();

    mostrarToast(
        "Venta eliminada."
    );

}


/* =========================================================
   MOSTRAR HISTORIAL
========================================================= */

function cargarVentasLocales(){

    const div =
        document.getElementById(
            "listaLocal"
        );


    let ventas =
        obtenerVentas();


    const texto =
        (
            buscador.value || ""
        )
        .trim()
        .toLowerCase();


    if(texto){

        ventas =
            ventas.filter(v => {

                return Object
                    .values(v)
                    .join(" ")
                    .toLowerCase()
                    .includes(texto);

            });

    }


    actualizarEstadisticas();


    if(ventas.length === 0){

        div.innerHTML =
            '<div class="empty">'
            + '<i class="fa-solid fa-folder-open" '
            + 'style="font-size:28px;"></i>'
            + '<br><br>'
            + 'No hay registros.'
            + '</div>';

        return;

    }


    div.innerHTML =
        ventas.map(v => {

            const estado =
                v.sincronizado
                ? "☁️"
                : "⏳";


            return `

            <div class="venta-item">

                <div class="status-icon">
                    ${estado}
                </div>

                <div
                    class="btn-del"
                    onclick="eliminarVenta('${escaparAtributo(v.id)}')">

                    <i class="fa-solid fa-trash-can"></i>

                </div>


                <div class="venta-tel">
                    ${escapar(v["NUM. CELULAR"])}
                </div>


                <div class="venta-tipo">
                    ${escapar(v["Renuevate / Kit / Chip / Porta"])}
                    -
                    ${escapar(v["FECHA DE ACTIVACION"])}
                </div>


                <div class="grid-datos">

                    <div class="dato">

                        <b>ICCID</b>

                        ${escapar(v["ICCID"])}

                    </div>


                    <div class="dato">

                        <b>TIENDA</b>

                        ${escapar(
                            v["SOLO NOMBRE DE TIENDA SIN CADENA"]
                        )}

                    </div>


                    <div class="dato">

                        <b>IMEI</b>

                        ${escapar(v["IMEI"])}

                    </div>


                    <div class="dato">

                        <b>PROMOTOR</b>

                        ${escapar(
                            v["NOMBRE COMPLETO PROMOTOR"]
                        )}

                    </div>

                </div>

            </div>

            `;

        })
        .join("");

}


/* =========================================================
   ESTADISTICAS
========================================================= */

function actualizarEstadisticas(){

    const ventas =
        obtenerVentas();


    const total =
        ventas.length;


    const sincronizadas =
        ventas.filter(
            v => v.sincronizado
        ).length;


    const pendientes =
        total - sincronizadas;


    totalVentas.textContent =
        total;

    ventasSync.textContent =
        sincronizadas;

    ventasPend.textContent =
        pendientes;

}


/* =========================================================
   EXCEL
========================================================= */

function exportarExcel(){

    const ventas =
        obtenerVentas();


    if(ventas.length === 0){

        alert(
            "No hay ventas para exportar."
        );

        return;

    }


    const columnas = [

        "Renuevate / Kit / Chip / Porta",

        "FECHA DE ACTIVACION",

        "NUM. CELULAR",

        "ICCID",

        "IMEI",

        "MARCA",

        "MODELO",

        "# TIENDA / Determinante",

        "SOLO NOMBRE DE LA CADENA",

        "SOLO NOMBRE DE TIENDA SIN CADENA",

        "NOMBRE COMPLETO PROMOTOR"

    ];


    const datos =
        ventas.map(v => {

            const fila = {};

            columnas.forEach(
                columna => {

                    fila[columna] =
                        v[columna] || "";

                }
            );

            return fila;

        });


    const ws =
        XLSX.utils.json_to_sheet(
            datos
        );


    /*
       Anchos de columnas
    */

    ws["!cols"] = [

        {wch:22},
        {wch:18},
        {wch:16},
        {wch:22},
        {wch:18},
        {wch:15},
        {wch:20},
        {wch:22},
        {wch:28},
        {wch:32},
        {wch:32}

    ];


    const wb =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        wb,
        ws,
        "Registro"
    );


    const fecha =
        new Date()
        .toISOString()
        .slice(0,10);


    XLSX.writeFile(
        wb,
        "ventas_teledata_" + fecha + ".xlsx"
    );


    mostrarToast(
        "Excel generado correctamente."
    );

}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapar(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escaparAtributo(valor){

    return String(valor ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* =========================================================
   TOAST
========================================================= */

function mostrarToast(mensaje){

    const viejo =
        document.querySelector(
            ".toast"
        );


    if(viejo){

        viejo.remove();

    }


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast";


    toast.textContent =
        mensaje;


    document.body.appendChild(
        toast
    );


    setTimeout(
        () => toast.remove(),
        2800
    );

}


/* =========================================================
   INICIAR
========================================================= */

window.addEventListener(
    "load",
    inicio
);
