<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Comisiones Omar · Login e Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Librería para lectura de códigos de barra mediante cámara -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
  :root{
    --azul-950:#001226;
    --azul-900:#001d3d;
    --azul-800:#003566;
    --azul-700:#0a4a85;
    --dorado:#ffc300;
    --dorado-soft:#ffd84d;
    --telcel:#00b4d8;
    --att:#ff7a1a;
    --bait:#9d4edd;
    --ok:#2dd4a7;
    --error:#ff5c7a;
    --vidrio-borde:rgba(255,255,255,.10);
    --texto-tenue:rgba(255,255,255,.55);
    --fuente-display:'Space Grotesk',sans-serif;
    --fuente-cuerpo:'Inter',sans-serif;
    --fuente-mono:'JetBrains Mono',monospace;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:var(--fuente-cuerpo);
    background:var(--azul-950);
    color:#f4f6fa;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- FONDO VIVO ---------- */
  .login-overlay{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 18% 8%, rgba(0,180,216,.16), transparent 42%),
      radial-gradient(circle at 88% 22%, rgba(255,195,0,.10), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(157,78,221,.08), transparent 45%),
      linear-gradient(165deg,var(--azul-950) 0%, var(--azul-900) 45%, #00040c 100%);
  }

  .malla-ticket{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 34px);
    mask-image:radial-gradient(circle at 50% 35%, rgba(0,0,0,.9), transparent 70%);
    animation:derivaTicket 26s linear infinite;
  }
  @keyframes derivaTicket{from{background-position:0 0;}to{background-position:0 340px;}}

  .orbe{
    position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;
    animation:flotar 11s ease-in-out infinite;
  }
  .orbe-1{width:260px;height:260px;background:var(--telcel);top:8%;left:8%;}
  .orbe-2{width:220px;height:220px;background:var(--dorado);bottom:10%;right:10%;animation-delay:-4s;}
  @keyframes flotar{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(18px,-22px) scale(1.08);}
  }

  /* ---------- CAJA DE LOGIN ---------- */
  .login-box{
    position:relative; z-index:2; width:100%; max-width:420px; padding:38px 32px; border-radius:26px;
    background:linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.035));
    border:1px solid var(--vidrio-borde); backdrop-filter:blur(28px) saturate(160%); -webkit-backdrop-filter:blur(28px) saturate(160%);
    box-shadow: 0 30px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18); text-align:center;
  }
  .login-box::before{
    content:""; position:absolute; top:-2px; left:-2px; right:-2px; height:3px;
    background:linear-gradient(90deg,var(--telcel),var(--dorado),var(--bait),var(--telcel)); background-size:200% 100%; animation:correrBorde 6s linear infinite;
  }
  @keyframes correrBorde{to{background-position:200% 0;}}

  .login-mark{
    width:54px; height:54px; border-radius:15px; margin:0 auto 18px; background:linear-gradient(135deg,var(--dorado),var(--telcel));
    display:flex; align-items:center; justify-content:center; font-family:var(--fuente-display); font-weight:700; color:var(--azul-950); font-size:21px; position:relative;
  }

  .login-box h2{margin:0 0 5px; font-family:var(--fuente-display); font-weight:700; font-size:22px;}
  .login-box p{font-size:12.5px; color:var(--texto-tenue); margin:0 0 28px;}

  .login-tabs{ display:flex; background:rgba(0,0,0,.32); padding:4px; border-radius:13px; margin-bottom:22px; border:1px solid var(--vidrio-borde); position:relative; }
  .login-tab-btn{ flex:1; padding:11px; background:transparent; border:none; color:var(--texto-tenue); font-weight:600; font-size:13px; cursor:pointer; border-radius:10px; position:relative; z-index:1; font-family:inherit; }
  .login-tab-btn.active{color:var(--azul-950);}
  .tab-deslizante{ position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px); background:var(--dorado); border-radius:10px; transition:transform .3s cubic-bezier(.16,1,.3,1); }
  .login-tabs.modo-registro .tab-deslizante{transform:translateX(100%);}

  .btn-google{ background:#fff; color:#1f1f1f; width:100%; padding:14px; border:none; border-radius:13px; font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:22px; }
  .separator{ display:flex; align-items:center; text-align:center; color:#5b6577; font-size:10.5px; margin-bottom:22px; text-transform:uppercase; font-weight:600; }
  .separator::before,.separator::after{content:""; flex:1; border-bottom:1px solid rgba(255,255,255,.12);}
  .separator:not(:empty)::before{margin-right:.75em;} .separator:not(:empty)::after{margin-left:.75em;}

  .campo-error{ background:rgba(255,92,122,.12); border:1px solid rgba(255,92,122,.4); color:#ffb3c0; font-size:12px; padding:11px 13px; border-radius:11px; margin-bottom:16px; text-align:left; display:none; align-items:flex-start; gap:9px; }
  .campo-error.visible{display:flex;}

  .grupo-campo{position:relative; margin-bottom:16px; text-align:left;}
  .grupo-campo i{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--texto-tenue); font-size:14px; }
  .grupo-campo input{ width:100%; padding:14px 14px 14px 40px; border-radius:12px; border:1px solid transparent; background:rgba(255,255,255,.07); color:#fff; font-size:14px; outline:none; font-family:inherit; }
  .grupo-campo input:focus{border-color:var(--dorado);}

  /* Adaptación de campo para incluir el botón de escáner a la derecha */
  .grupo-campo.con-accion input { padding-right: 50px; }
  .btn-accion-campo { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:var(--telcel); font-size:18px; cursor:pointer; padding:6px; transition:color .2s; }
  .btn-accion-campo:hover { color:var(--dorado); }

  .btn-save{ background:var(--dorado); color:var(--azul-950); width:100%; padding:16px; border:none; border-radius:13px; font-weight:700; cursor:pointer; font-size:15.5px; font-family:var(--fuente-display); }
  .login-footer-link{ display:inline-block; font-size:12px; color:var(--telcel); background:none; border:none; cursor:pointer; margin-top:16px; font-family:inherit; text-decoration:underline; }

  /* ---------- DISEÑO DEL PANEL DEL SISTEMA / FORMULARIO VENTAS ---------- */
  .panel-container { width: 100%; max-width: 600px; padding: 24px; background: rgba(255,255,255,0.03); border: 1px solid var(--vidrio-borde); border-radius: 24px; backdrop-filter: blur(20px); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--vidrio-borde); padding-bottom: 14px; }
  .btn-logout { background: rgba(255, 92, 122, 0.15); color: #ff5c7a; border: 1px solid rgba(255, 92, 122, 0.3); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }

  /* ---------- MODAL DEL ESCÁNER DE BARRAS ---------- */
  .modal-scanner { position: fixed; inset: 0; background: rgba(0,18,38,0.92); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-scanner-content { background: var(--azul-900); border: 1px solid var(--vidrio-borde); width: 100%; max-width: 450px; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
  .scanner-preview { width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-top: 15px; border: 2px solid var(--telcel); position: relative; }
  .btn-cerrar-modal { background: var(--error); color: #fff; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 15px; width: 100%; }

  .spinner{ display:inline-block; width:16px; height:16px; border:2px solid rgba(0,0,0,.25); border-top-color:#001226; border-radius:50%; animation:girar .7s linear infinite; }
  @keyframes girar{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
</style>
</head>
<body>

<!-- SECCIÓN ACCESO (LOGIN) -->
<div class="login-overlay" id="seccionLogin">
  <div class="malla-ticket"></div>
  <div class="orbe orbe-1"></div>
  <div class="orbe orbe-2"></div>

  <div class="login-box">
    <div class="login-mark">CO</div>
    <h2>Comisiones Omar</h2>
    <p>Inicia sesión para acceder a tus ventas, sincronizadas en la nube</p>

    <div class="login-tabs" id="tabsAcceso">
      <button id="tabOpLogin" class="login-tab-btn active" data-tab="LOGIN" onclick="alternarFormularioAcceso('LOGIN')" type="button">Entrar</button>
      <button id="tabOpRegistro" class="login-tab-btn" data-tab="REGISTRO" onclick="alternarFormularioAcceso('REGISTRO')" type="button">Crear cuenta</button>
      <div class="tab-deslizante"></div>
    </div>

    <button class="btn-google" onclick="ejecutarLoginGoogle()" type="button" id="btnGoogleLogin">
      <i class="fa-brands fa-google" style="color:#4285F4;"></i> Continuar con Google
    </button>

    <div class="separator">O con tu correo</div>

    <div class="campo-error" id="errorLogin"><i class="fa-solid fa-triangle-exclamation"></i><span id="errorLoginTexto"></span></div>

    <form id="fAcceso" onsubmit="procesarAutenticacion(event)">
      <input type="hidden" id="tipoAccesoActual" value="LOGIN">
      <div class="grupo-campo">
        <input type="email" id="logEmail" placeholder="Correo electrónico" required autocomplete="email">
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="grupo-campo">
        <input type="password" id="logPass" placeholder="Contraseña" required autocomplete="current-password" minlength="6">
        <i class="fa-solid fa-lock"></i>
      </div>
      <button type="submit" id="btnAccesoAccion" class="btn-save">
        <span id="btnAccesoTexto">INGRESAR AL PANEL</span>
      </button>
    </form>
    
    <button class="login-footer-link" id="btnOlvidoPass" onclick="recuperarPassword()" type="button">¿Olvidaste tu contraseña?</button>
  </div>
</div>

<!-- SECCIÓN PRINCIPAL DEL SISTEMA (PANEL DE VENTAS) -->
<div class="hidden" id="wrapperSistema" style="position:fixed; inset:0; background:var(--azul-950); display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;">
  <div class="panel-container">
    <div class="panel-header">
      <div>
        <h3 style="margin:0; font-family:var(--fuente-display); font-size:18px;" id="txtUsuarioActivo"></h3>
        <span style="font-size:11px; color:var(--texto-tenue);">Panel Sistema Ventas 4029</span>
      </div>
      <button class="btn-logout" onclick="cerrarSesionSistema()" type="button">
        <i class="fa-solid fa-power-off"></i> Salir
      </button>
    </div>

    <!-- Formulario demo para guardar el registro local/nube e ingresar código de barras -->
    <h2 style="font-family:var(--fuente-display); font-size:20px; margin:0 0 16px 0; color:var(--dorado);">Registrar Venta / Artículo</h2>
    
    <div class="grupo-campo con-accion">
      <input type="text" id="codigoArticulo" placeholder="Código de barras (IMEI / ICCID / SKU)">
      <i class="fa-solid fa-barcode"></i>
      <!-- Botón activador del lector de cámara -->
      <button type="button" class="btn-accion-campo" onclick="abrirLectorBarras()" title="Escanear con cámara">
        <i class="fa-solid fa-camera"></i>
      </button>
    </div>

    <div class="grupo-campo">
      <input type="text" id="nombreArticulo" placeholder="Nombre del producto o descripción">
      <i class="fa-solid fa-box"></i>
    </div>

    <button type="button" class="btn-save" style="margin-top:10px;" onclick="guardarRegistroVenta()">
      <i class="fa-solid fa-floppy-disk"></i> GUARDAR LOCALMENTE (EXCEL FORMAT)
    </button>
  </div>
</div>

<!-- MODAL CÁMARA (LECTOR DE BARRAS INTERACTIVO) -->
<div id="modalScanner" class="modal-scanner hidden">
  <div class="modal-scanner-content">
    <h3 style="margin:0 0 5px 0; font-family:var(--fuente-display);">Escanear Código de Barras</h3>
    <p style="font-size:12px; color:var(--texto-tenue); margin:0 0 15px 0;">Apunta con la cámara trasera hacia el código de barras del producto</p>
    
    <!-- Contenedor donde se dibuja el visor de la cámara -->
    <div id="lectorCamara" class="scanner-preview"></div>
    
    <button type="button" class="btn-cerrar-modal" onclick="cerrarLectorBarras()">Cancelar Escaneo</button>
  </div>
</div>

<script>
  // ---------- CONFIGURACIÓN DE FIREBASE ----------
  const firebaseConfig = {
    apiKey: "AIzaSyD4UK_j8UxMwOCtrtXlYftBe_wCLE7psMc",
    authDomain: "ventastelcel4029.firebaseapp.com",
    databaseURL: "https://ventastelcel4029-default-rtdb.firebaseio.com",
    projectId: "ventastelcel4029",
    storageBucket: "ventastelcel4029.firebasestorage.app",
    messagingSenderId: "480758010888",
    appId: "1:480758010888:web:e948c54f0217536aa9adbd"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  let html5QrcodeScanner = null;

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

  // ---------- CONTROL DEL ESCÁNER DE BARRAS (Html5Qrcode) ----------
  function abrirLectorBarras() {
    document.getElementById('modalScanner').classList.remove('hidden');
    
    // Instancia el lector apuntando al div contenedor
    html5QrcodeScanner = new Html5Qrcode("lectorCamara");
    
    const configuracion = { 
      fps: 15, 
      qrbox: { width: 300, height: 150 }, // Caja extendida horizontal perfecta para códigos de barras largos
      aspectRatio: 1.777778 // Forzar formato panorámico 16:9 común en smartphones
    };

    // Inicializa la cámara utilizando por defecto la cámara trasera ('environment')
    html5QrcodeScanner.start(
      { facingMode: "environment" }, 
      configuracion,
      onEscaneoExitoso,
      onEscaneoFallo
    ).catch(err => {
      alert("Error al iniciar cámara: " + err);
      cerrarLectorBarras();
    });
  }

  function onEscaneoExitoso(textoCodigo, resultadoObjeto) {
    // Al detectar un código válido, lo inyecta en el input y limpia la cámara
    document.getElementById('codigoArticulo').value = textoCodigo;
    
    // Pequeño feedback sonoro nativo si el celular lo permite
    if(window.navigator && window.navigator.vibrate) {
       window.navigator.vibrate(100);
    }
    
    cerrarLectorBarras();
  }

  function onEscaneoFallo(error) {
    // Se ejecuta de manera continua buscando el código. No es necesario alertar errores aquí.
    console.log("Buscando código...");
  }

  function cerrarLectorBarras() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        html5QrcodeScanner = null;
        document.getElementById('modalScanner').classList.add('hidden');
      }).catch(err => {
        console.error("Error apagando la cámara:", err);
        document.getElementById('modalScanner').classList.add('hidden');
      });
    } else {
      document.getElementById('modalScanner').classList.add('hidden');
    }
  }

  // ---------- SISTEMA DE ALMACENAMIENTO DE VENTAS LOCALES ----------
  function guardarRegistroVenta() {
    const cod = document.getElementById('codigoArticulo').value.trim();
    const nom = document.getElementById('nombreArticulo').value.trim();
    
    if(!cod){
      alert("Por favor ingresa o escanea un código primero.");
      return;
    }

    // Obtención de fecha con formato estricto DD/MM/YYYY solicitado
    const hoy = new Date();
    const dd = String(hoy.getDate()).padStart(2, '0');
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const yyyy = hoy.getFullYear();
    const fechaFormateada = `${dd}/${mm}/${yyyy}`;

    const nuevaVenta = {
      fecha: fechaFormateada,
      codigo: cod,
      descripcion: nom || "Producto General",
      timestamp: new Date().getTime()
    };

    // Guardado en arreglo local respetando el historial del dispositivo
    let historial = JSON.parse(localStorage.getItem('ventas_locales_excel')) || [];
    historial.push(nuevaVenta);
    localStorage.setItem('ventas_locales_excel', JSON.stringify(historial));

    alert(`¡Guardado localmente!\nFecha: ${fechaFormateada}\nCódigo: ${cod}\nListo para exportación tipo Excel.`);
    
    // Limpieza de campos
    document.getElementById('codigoArticulo').value = "";
    document.getElementById('nombreArticulo').value = "";
  }

  // ---------- UI: LOGIN Y MANTENIMIENTO ----------
  function alternarFormularioAcceso(tipo){
    document.getElementById('tipoAccesoActual').value = tipo;
    document.getElementById('tabOpLogin').classList.toggle('active', tipo === 'LOGIN');
    document.getElementById('tabOpRegistro').classList.toggle('active', tipo === 'REGISTRO');
    document.getElementById('tabsAcceso').classList.toggle('modo-registro', tipo === 'REGISTRO');
    document.getElementById('btnAccesoTexto').textContent = tipo === 'LOGIN' ? 'INGRESAR AL PANEL' : 'CREAR CUENTA';
    document.getElementById('btnOlvidoPass').classList.toggle('hidden', tipo !== 'LOGIN');
    ocultarError();
  }

  function ocultarError(){
    const errBox = document.getElementById('errorLogin');
    errBox.classList.remove('visible');
    errBox.style.borderColor = 'rgba(255,92,122,.4)';
    errBox.style.color = '#ffb3c0';
    errBox.style.background = 'rgba(255,92,122,.12)';
  }

  function mostrarError(msg, esExito = false){
    const errBox = document.getElementById('errorLogin');
    document.getElementById('errorLoginTexto').textContent = msg;
    if (esExito) {
      errBox.style.borderColor = 'var(--ok)';
      errBox.style.color = '#bdf5e6';
      errBox.style.background = 'rgba(45,212,167,.12)';
    }
    errBox.classList.add('visible');
  }

  function traducirErrorFirebase(codigo){
    const mapa = {
      'auth/invalid-email': 'El correo no tiene un formato válido.',
      'auth/user-disabled': 'Esta cuenta fue deshabilitada.',
      'auth/user-not-found': 'No existe una cuenta con ese correo.',
      'auth/wrong-password': 'Contraseña incorrecta.',
      'auth/invalid-credential': 'Correo o contraseña incorrectos.',
      'auth/email-already-in-use': 'Ya existe una cuenta con ese correo.',
      'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
      'auth/network-request-failed': 'Sin conexión a internet.',
      'auth/too-many-requests': 'Demasiados intentos. Espera un momento.'
    };
    return mapa[codigo] || 'Ocurrió un error. Intenta de nuevo.';
  }

  function procesarAutenticacion(e){
    e.preventDefault();
    ocultarError();

    const tipo = document.getElementById('tipoAccesoActual').value;
    const correo = document.getElementById('logEmail').value.trim();
    const clave = document.getElementById('logPass').value;
    const boton = document.getElementById('btnAccesoAccion');
    const textoBoton = document.getElementById('btnAccesoTexto');
    const original = textoBoton.innerHTML;

    boton.disabled = true;
    textoBoton.innerHTML = '<span class="spinner"></span> Procesando...';

    if(tipo === 'LOGIN'){
      auth.signInWithEmailAndPassword(correo, clave)
        .then((credencial) => { mostrarPanelPrincipal(credencial.user); })
        .catch((err) => { mostrarError(traducirErrorFirebase(err.code)); })
        .finally(() => { boton.disabled = false; textoBoton.innerHTML = original; });
    } else {
      auth.createUserWithEmailAndPassword(correo, clave)
        .then((credencial) => {
          localStorage.setItem(`registro_${credencial.user.uid}`, JSON.stringify({correo: credencial.user.email, creadoEn: new Date().getTime()}));
          return db.collection('usuarios').doc(credencial.user.uid).set({
            correo: credencial.user.email, creadoEn: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => credencial.user);
        })
        .then((user) => { mostrarPanelPrincipal(user); })
        .catch((err) => { mostrarError(traducirErrorFirebase(err.code)); })
        .finally(() => { boton.disabled = false; textoBoton.innerHTML = original; });
    }
  }

  function ejecutarLoginGoogle(){
    ocultarError();
    const proveedor = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(proveedor)
      .then((resultado) => {
        const user = resultado.user;
        localStorage.setItem(`registro_${user.uid}`, JSON.stringify({correo: user.email, creadoEn: new Date().getTime()}));
        return db.collection('usuarios').doc(user.uid).set({
          correo: user.email, nombre: user.displayName || '', creadoEn: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).then(() => user);
      })
      .then((user) => { mostrarPanelPrincipal(user); })
      .catch((err) => { if(err.code !== 'auth/popup-closed-by-user') mostrarError(traducirErrorFirebase(err.code)); });
  }

  function recuperarPassword(){
    ocultarError();
    const correo = document.getElementById('logEmail').value.trim();
    if(!correo){
      mostrarError('Escribe tu correo arriba primero para restablecer.');
      return;
    }
    auth.sendPasswordResetEmail(correo)
      .then(() => { mostrarError('Te enviamos un correo para restablecer tu contraseña.', true); })
      .catch((err) => { mostrarError(traducirErrorFirebase(err.code)); });
  }

  auth.onAuthStateChanged((user) => { if(user){ mostrarPanelPrincipal(user); } });

  function mostrarPanelPrincipal(user){
    document.getElementById('seccionLogin').classList.add('hidden');
    document.getElementById('wrapperSistema').classList.remove('hidden');
    document.getElementById('txtUsuarioActivo').textContent = user.email;
  }

  function cerrarSesionSistema(){
    auth.signOut().then(() => {
      document.getElementById('wrapperSistema').classList.add('hidden');
      document.getElementById('seccionLogin').classList.remove('hidden');
    });
  }
</script>

</body>
</html>
